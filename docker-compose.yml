services:
  rpa-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpa_orchestrator
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Onde a aplicação salva os dados: /app/backend/data (db.json, secret.key, screenshots/ e downloads/)
      # Opção 1: Volume nomeado gerenciado pelo Docker (Padrão)
      - rpa_data:/app/backend/data
      # Opção 2: Mapeamento de pasta física no servidor/host (Exemplo)
      # - ./data:/app/backend/data
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      # Secret key for encrypting/decrypting sensitive variables (RPA module secrets)
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_key_in_production}
      # Run playwright headlessly
      - HEADLESS=${HEADLESS:-true}
      # Optional system password access for frontend and REST API
      - SYSTEM_PASSWORD=${SYSTEM_PASSWORD:-}
    restart: unless-stopped

volumes:
  rpa_data:
    driver: local
